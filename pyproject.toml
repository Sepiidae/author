[project]
name = "author"
version = "0.1.0"
description = "A tool to assist authors in developing books with AI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlmodel>=0.0.16",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "PyYAML>=6.0",
    "openai>=1.30",
    "aiofiles>=24.1",
    "httpx>=0.27",
    "email-validator>=2.1",
    "aiosqlite>=0.20",
    "psycopg2-binary>=2.9",
    "pymysql>=1.1",
    "cryptography>=42.0",
]

[project.optional-dependencies]
export = ["ebooklib>=0.18", "beautifulsoup4>=4.12", "markdown>=3.6", "jinja2>=3.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
